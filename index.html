<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TourApp</title>

<!-- =========================================================================
     UNE SEULE CHOSE À MODIFIER
     Remplace les DEUX occurrences de https://script.google.com/macros/s/AKfycbwddhFE3m-S5xkuoKpXIu5jXchvNUoUFID4egvwSWAvjZpJHg7KoDTvQyI4zGXYDrNA/exec par l'URL de ton
     application web Apps Script (celle qui finit par /exec).
     Elles sont dans le <script> tout en bas.
     ========================================================================= -->

<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="TourApp">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12100E">
<meta name="robots" content="noindex, nofollow">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{ --surface:#FFFDFB; --texte:#1A1613; --texte-2:#57514A; --accent:#0A7285; }
@media (prefers-color-scheme:dark){
  :root{ --surface:#12100E; --texte:#EDE9E3; --texte-2:#A8A29A; --accent:#22D3EE; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--surface);overflow:hidden;}
iframe{
  position:fixed; inset:0; width:100%; height:100%;
  border:0; display:block; background:var(--surface);
}
/* Écran d'attente, recouvert par le cadre dès qu'il a chargé */
#attente{
  position:fixed; inset:0; z-index:2; background:var(--surface);
  font-family:Inter,system-ui,-apple-system,sans-serif; color:var(--texte);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; text-align:center; padding:24px;
  transition:opacity .25s ease;
}
#attente.parti{opacity:0; pointer-events:none;}
#pin{
  font:inherit;font-size:30px;font-weight:600;letter-spacing:.32em;text-align:center;
  width:220px;padding:14px 10px 14px 20px;border-radius:16px;
  border:2px solid var(--texte-2);background:var(--surface);color:var(--texte);
  font-variant-numeric:tabular-nums;}
#pin:focus{outline:none;border-color:var(--accent);}
.refus{color:#B3183A;font-weight:600;}
@media (prefers-color-scheme:dark){.refus{color:#FB7185;}}
img.logo{width:88px;height:88px;border-radius:24px;}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.02em;}
p{font-size:15px;color:var(--texte-2);margin:0;max-width:300px;}
a{color:var(--accent);font-weight:600;font-size:15px;text-decoration:none;}
.point{width:9px;height:9px;border-radius:50%;background:var(--accent);
  animation:p 1.1s ease-in-out infinite;}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .point{animation:none;opacity:.7}
  #attente{transition:none}
}
</style>
</head>
<body>

<div id="attente">
  <img class="logo" src="icon-192.png" alt="">
  <h1>TourApp</h1>
  <p id="titre">Ouverture du tableau de bord…</p>
  <div class="point" id="point" aria-hidden="true"></div>
  <input id="pin" type="tel" inputmode="numeric" maxlength="6"
         autocomplete="off" aria-label="Code d'accès" style="display:none">
  <p id="refus" class="refus" style="display:none">Code incorrect.</p>
  <p id="secours" style="display:none">
    L'affichage intégré a échoué.<br>
    <a id="lien" href="#">Ouvrir directement</a>
  </p>
</div>

<iframe id="app" title="TourApp"
        allow="clipboard-write"
        referrerpolicy="no-referrer"></iframe>

<script>
  var CIBLE = "https://script.google.com/macros/s/AKfycbwddhFE3m-S5xkuoKpXIu5jXchvNUoUFID4egvwSWAvjZpJHg7KoDTvQyI4zGXYDrNA/exec";
  document.getElementById('lien').href = "https://script.google.com/macros/s/AKfycbwddhFE3m-S5xkuoKpXIu5jXchvNUoUFID4egvwSWAvjZpJHg7KoDTvQyI4zGXYDrNA/exec";

  var cadre   = document.getElementById('app');
  var attente = document.getElementById('attente');
  var champ   = document.getElementById('pin');
  var CODE    = null;

  // Le code est retenu ICI, sur github.io, en premier niveau. Safari cloisonne
  // le stockage d'un cadre tiers : mémorisé dans l'application, il serait
  // oublié à chaque ouverture.
  try { CODE = localStorage.getItem('tourapp_code'); } catch(e) {}

  // Le thème est retenu ici aussi, pour la même raison que le code.
  var THEME = 'auto';
  try { THEME = localStorage.getItem('tourapp_theme') || 'auto'; } catch(e) {}

  function envoyerTheme(){
    try { cadre.contentWindow.postMessage({type:'tourapp-theme', valeur:THEME}, '*'); } catch(e) {}
  }

  function demanderCode(refuse){
    document.getElementById('titre').textContent = "Code d'accès";
    document.getElementById('point').style.display = 'none';
    document.getElementById('refus').style.display = refuse ? 'block' : 'none';
    champ.style.display = 'block';
    champ.value = '';
    champ.focus();
  }

  champ.addEventListener('input', function(){
    this.value = this.value.replace(/\D/g,'');
    if (this.value.length === 6){
      CODE = this.value;
      try { localStorage.setItem('tourapp_code', CODE); } catch(e) {}
      this.blur();
      this.style.display = 'none';
      document.getElementById('refus').style.display = 'none';
      document.getElementById('titre').textContent = 'Vérification…';
      document.getElementById('point').style.display = 'block';
      envoyerCode();
    }
  });

  function envoyerCode(){
    try { cadre.contentWindow.postMessage({type:'tourapp-code', valeur:CODE}, '*'); } catch(e) {}
  }

  // On ne se fie pas à l'événement « load » : il se déclenche aussi quand
  // Google renvoie une page d'erreur dans le cadre. Seule l'application
  // elle-même sait dire qu'elle a vraiment démarré.
  window.addEventListener('message', function(e){
    if (e.data === 'tourapp-pret') { attente.classList.add('parti'); return; }
    if (e.data && e.data.type === 'tourapp-theme') {
      THEME = e.data.valeur;
      try { localStorage.setItem('tourapp_theme', THEME); } catch(e2) {}
      return;
    }
    if (e.data === 'tourapp-code-refuse') {
      try { localStorage.removeItem('tourapp_code'); } catch(e2) {}
      CODE = null;
      attente.classList.remove('parti');
      demanderCode(true);
    }
  });

  // L'application est chargée : on lui transmet le code, ou on le demande.
  cadre.addEventListener('load', function(){
    envoyerTheme();
    if (CODE) envoyerCode(); else demanderCode(false);
  });

  // Au bout de 8 s sans signal, on propose la sortie manuelle.
  setTimeout(function(){
    if (!attente.classList.contains('parti'))
      document.getElementById('secours').style.display = 'block';
  }, 8000);

  // Au bout de 12 s, on découvre le cadre quoi qu'il arrive : mieux vaut
  // montrer le message d'erreur que laisser l'animation tourner sans fin.
  setTimeout(function(){
    if (champ.style.display !== 'block') attente.classList.add('parti');
  }, 12000);

  cadre.src = CIBLE;
</script>
</body>
</html>
