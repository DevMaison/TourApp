<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TourApp</title>

<!-- =========================================================================
     UNE SEULE CHOSE À MODIFIER
     Remplace les DEUX occurrences de COLLE_ICI_TON_URL par l'URL de ton
     application web Apps Script (celle qui finit par /exec).
     Elles sont dans la balise <script> en bas et dans le lien de secours.
     ========================================================================= -->

<!-- L'icône d'écran d'accueil : c'est la raison d'être de cette page.
     iOS lit ces balises sur le document de premier niveau — ce que la page
     Apps Script, servie dans un cadre Google, ne peut pas offrir. -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-title" content="TourApp">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12100E">
<meta name="robots" content="noindex, nofollow">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{ --surface:#FFFDFB; --texte:#1A1613; --texte-2:#57514A; --accent:#0A7285; }
@media (prefers-color-scheme:dark){
  :root{ --surface:#12100E; --texte:#EDE9E3; --texte-2:#A8A29A; --accent:#22D3EE; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--surface);}
body{
  font-family:Inter,system-ui,-apple-system,sans-serif; color:var(--texte);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; text-align:center; padding:24px;
}
img.logo{width:96px;height:96px;border-radius:26px;}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.02em;}
p{font-size:16px;color:var(--texte-2);margin:0;}
a{color:var(--accent);font-weight:600;font-size:16px;text-decoration:none;}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
.point{width:9px;height:9px;border-radius:50%;background:var(--accent);
  animation:p 1.1s ease-in-out infinite;}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.point{animation:none;opacity:.7}}
</style>
</head>
<body>

<img class="logo" src="icon-192.png" alt="">
<h1>TourApp</h1>
<p>Ouverture du tableau de bord…</p>
<div class="point" aria-hidden="true"></div>
<p><a id="secours" href="COLLE_ICI_TON_URL">Continuer manuellement</a></p>

<script>
  var CIBLE = "COLLE_ICI_TON_URL";

  // Petit délai : sans lui, la page disparaît avant qu'iOS ait lu les balises
  // d'icône, et l'ajout à l'écran d'accueil retombe sur une capture d'écran.
  // 400 ms suffisent et restent imperceptibles.
  setTimeout(function(){ location.replace(CIBLE); }, 400);
</script>
</body>
</html>
